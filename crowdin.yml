  - source: /amem_versioned_docs/version-1.0/**/*.md
    translation: /i18n/%two_letters_code%/docusaurus-plugin-content-docs-amem/version-1.0/**/%original_file_name%

  # ── 主题/插件字符串（导航栏、搜索面板、主题 UI）────────────
  # 源由 `npx docusaurus write-translations --locale zh-Hans` 生成；
  # code.json（搜索面板等代码翻译）与 navbar.json 一并纳入翻译范围
  - source: /i18n/zh-Hans/**/*.json
    translation: /i18n/%two_letters_code%/**/%original_file_name%
