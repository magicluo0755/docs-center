name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Markdown lint
        run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#build" "#output"
      - name: Vale 术语与文风检查（宽松模式，结果仅上报）
        uses: errata-ai/vale-action@v2
        with:
          files: products
          reporter: github-pr-check
          fail_on_error: false
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/
          retention-days: 7

  pdf-sample:
    # MR 抽样验证 PDF 管线不回归（下载 build 产物 + 静态服务器 + CI Chromium）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - name: Serve and generate sample PDF
        env:
          BROWSER_PATH: /usr/bin/chromium-browser
        run: |
          node scripts/serve-static.js 3000 &
          sleep 3
          node scripts/pdf/generate.js --product aas --version current --lang zh-Hans
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-sample
          path: output/pdf/

  pdf-release:
    # 打 tag 全量出稿：9 产品 × 3 语言 × 2 版本 = 54 份
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        product: [aas, admq, adc, alb, amdm, adgp, aig, akm, amem]
        lang: [zh-Hans, zh-Hant, en]
        version: [current, "1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - name: Install Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser
      - name: Generate PDF
        env:
          BROWSER_PATH: /usr/bin/chromium-browser
        run: |
          node scripts/serve-static.js 3000 &
          sleep 3
          node scripts/pdf/generate.js --product ${{ matrix.product }} --version ${{ matrix.version }} --lang ${{ matrix.lang }}
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-${{ matrix.product }}-${{ matrix.lang }}-${{ matrix.version }}
          path: output/pdf/

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: build
      - name: Deploy to static hosting
        run: echo "接入公司发布系统 / rsync / OSS 同步"
