# Vale 文风与术语检查配置（文档工程化质量门禁）
#
# 使用方式：
#   1. 安装 Vale CLI（https://vale.sh）
#   2. vale sync 拉取 StylesPath 下声明的外部样式包
#   3. vale products/ 或 vale <file>.md 对文档执行检查
#
# 样式策略：
#   - Vale 内置样式：拼写/可读性/字号单位等基础规则
#   - Apusic 术语表（Vocab）：企业产品术语保护，避免被误报拼写错误
#   - 接入 Crowdin 人工翻译后，可在 CI 对译文增量执行 Vale 检查

StylesPath = styles
MinAlertLevel = suggestion
Vocab = Apusic

[*.{md,mdx}]
BasedOnStyles = Vale

# 变更说明类文档（changelog）放宽
[*.changelog.md]
BasedOnStyles = Vale
Vale.Spelling = off
