# Apusic 文档中心 — 内网静态托管配置
# 静态站点（SSG 产物），无服务端逻辑；核心是多前缀路由回退与缓存策略

server {
    listen 80;
    server_name docs.example.apusic.internal;

    root /srv/docs-center;
    index index.html;

    # 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 带哈希的静态资源：强缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 文档路由回退（含 /en/ locale 前缀与版本路径）
    # SSG 产物目录结构即 URL 结构，仅对目录型访问补 index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # HTML 不缓存，保证发版即生效
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # PDF 下载（随站点一起构建：build/downloads/pdf，源为 output/pdf）
    # 注意：不再使用 alias 指向站点外目录——PDF 由 npm run prepare:assets
    # 同步进 static/downloads/pdf，构建产物自包含，换托管环境无需额外配置。
    location /downloads/pdf/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
